name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check . --output-format=github
      - name: Test
        run: pytest

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: ballotproof
          POSTGRES_PASSWORD: ballotproof
          POSTGRES_DB: ballotproof
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ballotproof -d ballotproof"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BALLOTPROOF_TEST_POSTGRES_URL: >-
        postgresql://ballotproof:ballotproof@127.0.0.1:5432/ballotproof
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e '.[dev,postgres]'
      - name: PostgreSQL integration tests
        run: >-
          pytest tests/test_postgres_integration.py
          tests/test_postgres_source_schema_integration.py
          tests/test_postgres_rate_limit_schema.py
          tests/test_postgres_release_snapshot_schema.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package.json
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
