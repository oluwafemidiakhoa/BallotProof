[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ballotproof"
version = "0.15.0"
description = "Independent, reproducible election evidence verification primitives."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Oluwafemi Idiakhoa" }]
dependencies = [
  "cryptography>=49,<50",
  "fastapi>=0.115,<2",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.scripts]
ballotproof = "ballotproof.cli:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ballotproof"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
